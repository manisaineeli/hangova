# Render Blueprint - one click deploy.
#
# Render runs the public gateway, which serves the React bundle and proxies the
# API to the three internal services.
#
# Deploy: https://render.com/deploy?repo=https://github.com/manisaineeli/hangova
#
# NOTE: Render's free tier sleeps idle services, so the first request after an
# idle period can take up to a minute.
#
# IMPORTANT: Render free tier only supports PostgreSQL natively. MongoDB must
# be provided externally via MongoDB Atlas (free M0 tier). After deploying,
# set the HANGOVA_MONGO_URI, HANGOVA_BOOKING_MONGO_URI, and HANGOVA_INFO_MONGO_URI
# environment variables on each service with your MongoDB Atlas connection string.

databases:
  - name: hangova-db
    databaseName: hangova
    plan: free

services:
  # ---- Module 1: User & Admin -------------------------------------------
  - type: web
    name: hangova-user
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: "8081"
      - key: HANGOVA_MONGO_URI
        value: "mongodb+srv://lexurisachs_db_user:<db_password>@m0.mlq0l6n.mongodb.net/"
      - key: HANGOVA_JWT_SECRET
        generateValue: true
      - key: HANGOVA_JWT_ISSUER
        value: hangova

  # ---- Module 2: AI Trip Planning ---------------------------------------
  - type: web
    name: hangova-trip
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: "8082"
      - key: HANGOVA_MONGO_URI
        value: "mongodb+srv://lexurisachs_db_user:<db_password>@m0.mlq0l6n.mongodb.net/hangova_trips"
      - key: HANGOVA_GEMINI_API_KEY
        sync: false
      - key: HANGOVA_GEMINI_MODEL
        value: gemini-2.0-flash

  # ---- Module 3: Borrow & Booking --------------------------------------
  - type: web
    name: hangova-booking
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: "8083"
      - key: HANGOVA_BOOKING_MONGO_URI
        value: "mongodb+srv://lexurisachs_db_user:<db_password>@m0.mlq0l6n.mongodb.net/hangova_bookings"
      - key: HANGOVA_TRIP_URL
        fromService: { name: hangova-trip, type: web, property: hostport }
      - key: HANGOVA_JWT_SECRET
        fromService: { name: hangova-user, type: web, envVarKey: HANGOVA_JWT_SECRET }

  # ---- Module 4: Travel Information -------------------------------------
  - type: web
    name: hangova-info
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: "8084"
      - key: HANGOVA_INFO_MONGO_URI
        value: "mongodb+srv://lexurisachs_db_user:<db_password>@m0.mlq0l6n.mongodb.net/hangova_info"
      - key: HANGOVA_TRIP_URL
        fromService: { name: hangova-trip, type: web, property: hostport }
      - key: HANGOVA_BOOKING_URL
        fromService: { name: hangova-booking, type: web, property: hostport }
      - key: HANGOVA_JWT_SECRET
        fromService: { name: hangova-user, type: web, envVarKey: HANGOVA_JWT_SECRET }

  # ---- Edge: API Gateway + the React bundle on one public URL -----------
  - type: web
    name: hangova
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: HANGOVA_JWT_SECRET
        fromService: { name: hangova-user, type: web, envVarKey: HANGOVA_JWT_SECRET }
      - key: HANGOVA_JWT_ISSUER
        value: hangova
      - key: HANGOVA_USER_URL
        fromService: { name: hangova-user, type: web, property: hostport }
      - key: HANGOVA_TRIP_URL
        fromService: { name: hangova-trip, type: web, property: hostport }
      - key: HANGOVA_BOOKING_URL
        fromService: { name: hangova-booking, type: web, property: hostport }
      - key: HANGOVA_INFO_URL
        fromService: { name: hangova-info, type: web, property: hostport }
